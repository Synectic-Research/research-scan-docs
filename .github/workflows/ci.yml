name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Links, metadata, sitemap and origin hygiene
        run: python3 scripts/check-site.py

      - name: Release facts — versions, transcripts, measurement scope
        run: python3 scripts/check-versions.py

      # Privacy leak only: this repo is public and must not name the private
      # deployment path. Nothing else belongs in this pattern.
      - name: Boundary sweep
        run: |
          if grep -riEn 'cloudflare|trycloudflare|tunnel|launchd|mcp\.synectic|path.?secret|RESEARCH_SCAN_MCP_TOKEN' \
               src public scripts theme.config.json astro.config.ts dist *.md; then
            echo "::error::Private-deployment term found above. Remove it; this repo is public."
            exit 1
          fi

      - name: Metadata drift
        run: |
          python3 scripts/sync-page-meta.py
          if ! git diff --exit-code src/content; then
            echo "::error::Page metadata is stale. Run: python3 scripts/sync-page-meta.py — then commit src/content."
            exit 1
          fi
